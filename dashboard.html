<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Benchmark Results Dashboard</title>
  <meta name="description" content="Interactive visualization of LLM benchmark scoring results across models and notebooks." />

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />

  <!-- Chart.js -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.3/dist/chart.umd.min.js"></script>
  <!-- Papa Parse (CSV parsing) -->
  <script src="https://cdn.jsdelivr.net/npm/papaparse@5.4.1/papaparse.min.js"></script>

  <style>
    /* ── Design tokens ──────────────────────────────────────────────── */
    :root {
      --bg:       #0d1117;
      --surface:  #161b22;
      --surface2: #1e2530;
      --border:   #30363d;
      --accent:   #58a6ff;
      --accent2:  #3fb950;
      --accent3:  #d2a8ff;
      --accent4:  #ffa657;
      --text:     #e6edf3;
      --text-muted: #8b949e;
      --radius:   12px;
      --radius-sm: 6px;
      --shadow:   0 8px 32px rgba(0,0,0,.45);
      /* Complexity palette */
      --cx-1: #58a6ff;
      --cx-2: #3fb950;
      --cx-3: #ffa657;
      --cx-4: #d2a8ff;
      --cx-5: #ff7b72;
    }

    /* ── Reset / base ───────────────────────────────────────────────── */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Inter', sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      line-height: 1.6;
    }

    /* ── Layout ─────────────────────────────────────────────────────── */
    header {
      background: linear-gradient(135deg, #0d1117 0%, #161b22 100%);
      border-bottom: 1px solid var(--border);
      padding: 24px 40px;
      display: flex;
      align-items: center;
      gap: 20px;
      position: sticky;
      top: 0;
      z-index: 100;
      backdrop-filter: blur(12px);
    }

    .logo {
      width: 40px; height: 40px;
      background: linear-gradient(135deg, var(--accent), var(--accent3));
      border-radius: 10px;
      display: flex; align-items: center; justify-content: center;
      font-size: 20px;
      flex-shrink: 0;
    }

    header h1 { font-size: 1.25rem; font-weight: 600; }
    header p  { font-size: 0.8rem; color: var(--text-muted); margin-top: 2px; }

    .header-right {
      margin-left: auto;
      display: flex;
      align-items: center;
      gap: 12px;
    }

    #file-upload-btn {
      display: flex; align-items: center; gap: 8px;
      padding: 8px 16px;
      background: var(--surface2);
      border: 1px solid var(--border);
      color: var(--text);
      border-radius: var(--radius-sm);
      cursor: pointer;
      font-size: 0.85rem;
      font-family: inherit;
      transition: border-color .2s, background .2s;
    }
    #file-upload-btn:hover { border-color: var(--accent); background: #1e2d3e; }

    #file-input { display: none; }

    #data-status {
      font-size: 0.78rem;
      color: var(--text-muted);
    }
    #data-status.loaded { color: var(--accent2); }

    main {
      max-width: 1400px;
      margin: 0 auto;
      padding: 32px 40px 60px;
    }

    /* ── Filters bar ─────────────────────────────────────────────────── */
    .filters {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 28px;
      flex-wrap: wrap;
    }

    .filter-label { font-size: 0.8rem; color: var(--text-muted); }

    select, input[type=range] {
      font-family: inherit;
      background: var(--surface2);
      border: 1px solid var(--border);
      color: var(--text);
      border-radius: var(--radius-sm);
      padding: 6px 12px;
      font-size: 0.83rem;
      cursor: pointer;
      transition: border-color .2s;
    }
    select:hover, select:focus { border-color: var(--accent); outline: none; }

    .pill {
      display: inline-flex; align-items: center; gap: 6px;
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 999px;
      padding: 4px 14px;
      font-size: 0.78rem;
      color: var(--text-muted);
      cursor: pointer;
      transition: all .2s;
    }
    .pill.active { background: #1e2d3e; border-color: var(--accent); color: var(--accent); }
    .pill:hover  { border-color: var(--accent); color: var(--accent); }

    /* ── Complexity badge ────────────────────────────────────────────── */
    .cx-badge {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      padding: 2px 10px;
      border-radius: 999px;
      font-size: 0.7rem;
      font-weight: 600;
      letter-spacing: .03em;
      font-family: 'JetBrains Mono', monospace;
    }

    /* ── Summary cards ──────────────────────────────────────────────── */
    .kpi-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 16px;
      margin-bottom: 32px;
    }

    .kpi-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 20px 24px;
      position: relative;
      overflow: hidden;
      transition: border-color .2s, transform .15s;
    }
    .kpi-card:hover { border-color: var(--accent); transform: translateY(-2px); }

    .kpi-card::before {
      content: '';
      position: absolute;
      top: 0; left: 0; right: 0;
      height: 3px;
      background: var(--kpi-color, var(--accent));
    }

    .kpi-label { font-size: 0.75rem; color: var(--text-muted); text-transform: uppercase; letter-spacing: .08em; }
    .kpi-value { font-size: 2rem; font-weight: 700; margin-top: 6px; color: var(--kpi-color, var(--text)); }
    .kpi-sub   { font-size: 0.78rem; color: var(--text-muted); margin-top: 4px; }

    /* ── Chart grid ─────────────────────────────────────────────────── */
    .chart-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 20px;
      margin-bottom: 24px;
    }

    .chart-grid.wide { grid-template-columns: 1fr; }

    @media (max-width: 900px) {
      .chart-grid { grid-template-columns: 1fr; }
    }

    .chart-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 24px;
      box-shadow: var(--shadow);
      transition: border-color .2s;
    }
    .chart-card:hover { border-color: var(--border); }

    .chart-card h2 {
      font-size: 0.95rem;
      font-weight: 600;
      margin-bottom: 4px;
    }
    .chart-card .chart-desc {
      font-size: 0.75rem;
      color: var(--text-muted);
      margin-bottom: 20px;
    }

    .chart-wrap {
      position: relative;
    }

    /* ── Detail table ───────────────────────────────────────────────── */
    .table-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 24px;
      margin-bottom: 24px;
      overflow: hidden;
    }

    .table-card h2 {
      font-size: 0.95rem;
      font-weight: 600;
      margin-bottom: 4px;
    }
    .table-card .chart-desc {
      font-size: 0.75rem;
      color: var(--text-muted);
      margin-bottom: 20px;
    }

    .table-controls {
      display: flex;
      gap: 10px;
      margin-bottom: 14px;
      flex-wrap: wrap;
    }

    #table-search {
      flex: 1;
      min-width: 180px;
      padding: 7px 12px;
      background: var(--surface2);
      border: 1px solid var(--border);
      color: var(--text);
      border-radius: var(--radius-sm);
      font-family: inherit;
      font-size: 0.83rem;
    }
    #table-search:focus { outline: none; border-color: var(--accent); }

    .table-scroll { overflow-x: auto; }

    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 0.82rem;
    }

    th {
      text-align: left;
      padding: 10px 14px;
      font-size: 0.72rem;
      text-transform: uppercase;
      letter-spacing: .07em;
      color: var(--text-muted);
      border-bottom: 1px solid var(--border);
      cursor: pointer;
      user-select: none;
      white-space: nowrap;
    }
    th:hover { color: var(--accent); }
    th .sort-icon { margin-left: 4px; opacity: .5; }
    th.sorted    { color: var(--accent); }
    th.sorted .sort-icon { opacity: 1; }

    td {
      padding: 10px 14px;
      border-bottom: 1px solid rgba(48,54,61,.5);
      white-space: nowrap;
    }
    tr:last-child td { border-bottom: none; }
    tr:hover td { background: var(--surface2); }

    .score-pill {
      display: inline-block;
      padding: 2px 10px;
      border-radius: 999px;
      font-weight: 500;
      font-size: 0.78rem;
      font-family: 'JetBrains Mono', monospace;
    }

    .bool-true  { color: var(--accent2); }
    .bool-false { color: #f85149; }

    /* ── Empty / loading state ──────────────────────────────────────── */
    .empty-state {
      text-align: center;
      padding: 80px 20px;
      color: var(--text-muted);
    }
    .empty-state .big-icon { font-size: 3rem; margin-bottom: 16px; }
    .empty-state h3 { font-size: 1.1rem; margin-bottom: 8px; font-weight: 500; }
    .empty-state p  { font-size: 0.85rem; }

    /* ── Tooltip (custom) ───────────────────────────────────────────── */
    .chart-legend {
      display: flex;
      gap: 16px;
      flex-wrap: wrap;
      margin-top: 12px;
    }
    .legend-item {
      display: flex; align-items: center; gap: 6px;
      font-size: 0.75rem; color: var(--text-muted);
    }
    .legend-dot {
      width: 10px; height: 10px; border-radius: 50%;
    }

    /* ── Misc ────────────────────────────────────────────────────────── */
    .section-title {
      font-size: 0.72rem;
      text-transform: uppercase;
      letter-spacing: .1em;
      color: var(--text-muted);
      margin-bottom: 14px;
    }

    @keyframes fadeIn { from { opacity:0; transform: translateY(10px); } to { opacity:1; transform: translateY(0); } }
    .fade-in { animation: fadeIn .35s ease forwards; }
  </style>
</head>
<body>

<!-- ── Header ──────────────────────────────────────────────────────────── -->
<header>
  <div class="logo">📊</div>
  <div>
    <h1>Benchmark Results Dashboard</h1>
    <p>LLM code generation scoring across notebooks and models</p>
  </div>
  <div class="header-right">
    <span id="data-status">No data loaded</span>
    <button id="file-upload-btn" onclick="document.getElementById('file-input').click()">
      📂 Load CSVs
    </button>
    <input type="file" id="file-input" accept=".csv" multiple />
  </div>
</header>

<!-- ── Main ────────────────────────────────────────────────────────────── -->
<main id="main-content">
  <div class="empty-state fade-in" id="empty-state">
    <div class="big-icon">🧪</div>
    <h3>Load your scoring reports to get started</h3>
    <p>Click <strong>Load CSVs</strong> in the top-right corner and select<br>
       <code>scoring_report.csv</code> and/or <code>scoring_report_aggregated.csv</code>.</p>
  </div>
</main>

<script>
/* ═══════════════════════════════════════════════════════════════════════
   State
════════════════════════════════════════════════════════════════════════*/
let aggData    = [];   // rows from scoring_report_aggregated.csv
let detailData = [];   // rows from scoring_report.csv

let detailSort = { col: 'train_score', dir: -1 };
let detailFilter = '';
let complexityFilter = '';  // '' = all, or a specific complexity value

/* ═══════════════════════════════════════════════════════════════════════
   Complexity helpers
════════════════════════════════════════════════════════════════════════*/
const CX_COLORS = {
  1: '#58a6ff',
  2: '#3fb950',
  3: '#ffa657',
  4: '#d2a8ff',
  5: '#ff7b72',
};
function cxColor(level) { return CX_COLORS[level] || '#8b949e'; }
function cxBg(level) {
  const c = cxColor(level);
  return c + '22';
}
function cxBadge(level) {
  if (level == null) return '';
  return `<span class="cx-badge" style="color:${cxColor(level)};background:${cxBg(level)}">C${level}</span>`;
}

/** Get all unique complexity values from the data. */
function allComplexities() {
  const fromAgg = aggData.map(r => r.complexity).filter(v => v != null);
  const fromDet = detailData.map(r => r.complexity).filter(v => v != null);
  return [...new Set([...fromAgg, ...fromDet])].sort((a,b) => a - b);
}

/** Does the dataset contain multiple complexity levels? */
function hasMultipleComplexities() {
  return allComplexities().length > 1;
}

/** Filter aggData by current complexity filter */
function getFilteredAgg() {
  if (!complexityFilter) return aggData;
  return aggData.filter(r => r.complexity != null && String(r.complexity) === String(complexityFilter));
}

/** Filter detailData by current complexity filter */
function getFilteredDetail() {
  if (!complexityFilter) return detailData;
  return detailData.filter(r => r.complexity != null && String(r.complexity) === String(complexityFilter));
}

/* ═══════════════════════════════════════════════════════════════════════
   File loading
════════════════════════════════════════════════════════════════════════*/
document.getElementById('file-input').addEventListener('change', async (e) => {
  const files = Array.from(e.target.files);
  for (const file of files) {
    const text = await file.text();
    const result = Papa.parse(text, { header: true, skipEmptyLines: true, dynamicTyping: true });
    const rows = result.data;
    if (!rows.length) continue;

    if ('train_score' in rows[0] && !('notebook_id' in rows[0])) {
      // aggregated (model, runner, [complexity,] train_score, inference_score, requirements_score)
      aggData = rows;
    } else {
      // detailed
      detailData = rows;
    }
  }

  if (aggData.length === 0 && detailData.length > 0) {
    // Synthesize aggregated from detail
    aggData = synthesizeAgg(detailData);
  }

  if (aggData.length || detailData.length) {
    const cxLevels = allComplexities();
    const cxLabel = cxLevels.length ? ` · complexity ${cxLevels.join(',')}` : '';
    document.getElementById('data-status').textContent =
      `${aggData.length} entries · ${detailData.length} scored runs${cxLabel}`;
    document.getElementById('data-status').classList.add('loaded');
    renderDashboard();
  }
  // reset so the same file can be re-loaded
  e.target.value = '';
});

function synthesizeAgg(rows) {
  const grouped = {};
  for (const r of rows) {
    const cx = r.complexity ?? 'all';
    const key = `${r.model}|||${r.runner || 'unknown'}|||${cx}`;
    if (!grouped[key]) grouped[key] = { model: r.model, runner: r.runner || 'unknown', complexity: r.complexity ?? null, train_score: [], inference_score: [], requirements_score: [] };
    grouped[key].train_score.push(+r.train_score || 0);
    grouped[key].inference_score.push(+r.inference_score || 0);
    grouped[key].requirements_score.push(+r.requirements_score || 0);
  }
  return Object.values(grouped).map(s => ({
    model:  s.model,
    runner: s.runner,
    complexity: s.complexity,
    train_score:        avg(s.train_score),
    inference_score:    avg(s.inference_score),
    requirements_score: avg(s.requirements_score),
  })).sort((a, b) => b.train_score - a.train_score);
}

const avg = arr => arr.length ? +(arr.reduce((s, v) => s + v, 0) / arr.length).toFixed(2) : 0;

/* ═══════════════════════════════════════════════════════════════════════
   Colour helpers
════════════════════════════════════════════════════════════════════════*/
const SCORE_PALETTE = [
  '#58a6ff','#3fb950','#d2a8ff','#ffa657','#ff7b72',
  '#79c0ff','#56d364','#bc8cff','#ffb86c','#ff6e6e',
  '#a5d6ff','#8ddb92','#d2a8ff','#ffc680','#ff9f9f',
  '#c9e4ff','#b3e8b7','#e5d3ff','#ffd9a8','#ffcaca',
];
const entryColor = (() => {
  const map = new Map();
  let idx = 0;
  return (key) => {
    if (!map.has(key)) map.set(key, SCORE_PALETTE[idx++ % SCORE_PALETTE.length]);
    return map.get(key);
  };
})();
function modelColor(model, runner) {
  return entryColor(runner ? `${model}|${runner}` : model);
}

function scoreColor(val) {
  if (val >= 80) return '#3fb950';
  if (val >= 60) return '#58a6ff';
  if (val >= 40) return '#ffa657';
  return '#ff7b72';
}

function scoreBg(val) {
  if (val >= 80) return 'rgba(63,185,80,.15)';
  if (val >= 60) return 'rgba(88,166,255,.15)';
  if (val >= 40) return 'rgba(255,166,87,.15)';
  return 'rgba(255,123,114,.15)';
}

/* ═══════════════════════════════════════════════════════════════════════
   Chart instances (kept for destroy on re-render)
════════════════════════════════════════════════════════════════════════*/
const charts = {};

function destroyChart(id) {
  if (charts[id]) { charts[id].destroy(); delete charts[id]; }
}

/* ═══════════════════════════════════════════════════════════════════════
   Dashboard renderer
════════════════════════════════════════════════════════════════════════*/
function renderDashboard() {
  const main = document.getElementById('main-content');
  main.innerHTML = buildHTML();

  // wire up events
  document.getElementById('table-search')?.addEventListener('input', e => {
    detailFilter = e.target.value.toLowerCase();
    rerenderTable();
  });

  document.querySelectorAll('th[data-col]').forEach(th => {
    th.addEventListener('click', () => {
      const col = th.dataset.col;
      if (detailSort.col === col) detailSort.dir *= -1;
      else { detailSort.col = col; detailSort.dir = -1; }
      rerenderTable();
    });
  });

  // Complexity filter pills
  document.querySelectorAll('.cx-pill').forEach(btn => {
    btn.addEventListener('click', () => {
      complexityFilter = btn.dataset.cx;
      renderDashboard();
    });
  });

  const fAgg = getFilteredAgg();
  const fDet = getFilteredDetail();

  if (fAgg.length) {
    renderBarChart();
    renderRadarChart();
    renderScatterChart();
    renderRunChart();
  }
  if (fDet.length) {
    renderNotebookHeatmap();
    renderVarianceChart();
  }
  if (hasMultipleComplexities() && detailData.length) {
    renderComplexityChart();
  }
  renderTable();
}

/* ── HTML skeleton ──────────────────────────────────────────────────── */
function buildHTML() {
  const fAgg = getFilteredAgg();
  const fDet = getFilteredDetail();
  const sorted = [...fAgg].sort((a, b) => b.train_score - a.train_score);
  const best = sorted[0] || {};
  const bestInf = fAgg.length ? [...fAgg].sort((a,b)=>b.inference_score-a.inference_score)[0] : null;
  const cxLevels = allComplexities();
  const multiCx = hasMultipleComplexities();

  return `
  <div class="fade-in">
    ${multiCx ? `
    <!-- Complexity filter -->
    <div class="filters" style="margin-bottom:20px">
      <span class="filter-label">Complexity:</span>
      <button class="pill cx-pill ${complexityFilter===''?'active':''}" data-cx="">All levels</button>
      ${cxLevels.map(cx => `
        <button class="pill cx-pill ${String(complexityFilter)===String(cx)?'active':''}"
                data-cx="${cx}"
                style="${String(complexityFilter)===String(cx) ? `border-color:${cxColor(cx)};color:${cxColor(cx)};background:${cxBg(cx)}` : ''}">
          <span style="display:inline-block;width:8px;height:8px;border-radius:50%;background:${cxColor(cx)}"></span>
          Level ${cx}
        </button>`).join('')}
    </div>` : ''}

    <!-- KPI row -->
    <div class="kpi-grid" style="margin-top:0">
      ${kpiCard('Model × Runner combos', fAgg.length, complexityFilter ? `complexity ${complexityFilter}` : '', 'var(--accent)')}
      ${kpiCard('Scored runs', fDet.length, 'notebook × model × runner × run', 'var(--accent2)')}
      ${kpiCard('Best train score', best.train_score ?? '—', best.model ? entryLabel(best) : '', '#ffa657')}
      ${kpiCard('Best inference score',
          bestInf ? bestInf.inference_score : '—',
          bestInf ? entryLabel(bestInf) : '',
          'var(--accent3)')}
      ${kpiCard('Avg requirements match',
          fAgg.length ? avg(fAgg.map(r=>r.requirements_score)).toFixed(1) + '%' : '—',
          'across all entries', 'var(--accent)')}
      ${multiCx ? kpiCard('Complexity levels', cxLevels.join(', '), `${cxLevels.length} levels in dataset`, 'var(--accent4)') : ''}
    </div>

    <!-- Chart row 1 -->
    <div class="chart-grid" style="margin-bottom:20px">
      <div class="chart-card">
        <h2>Leaderboard — Train Score</h2>
        <p class="chart-desc">Average train score per model × runner${complexityFilter ? ` (complexity ${complexityFilter})` : ''}, sorted descending.</p>
        <div class="chart-wrap"><canvas id="chart-bar" height="340"></canvas></div>
      </div>
      <div class="chart-card">
        <h2>Score Breakdown Radar</h2>
        <p class="chart-desc">Top-8 entries across all three scoring dimensions (normalised to 100).</p>
        <div class="chart-wrap"><canvas id="chart-radar" height="340"></canvas></div>
      </div>
    </div>

    <!-- Chart row 2 -->
    <div class="chart-grid" style="margin-bottom:20px">
      <div class="chart-card">
        <h2>Train vs Inference Score</h2>
        <p class="chart-desc">Each dot is one model × runner combination. Hover for details.</p>
        <div class="chart-wrap"><canvas id="chart-scatter" height="300"></canvas></div>
      </div>
      <div class="chart-card">
        <h2>Score Consistency Across Runs</h2>
        <p class="chart-desc">Train score per run for each model (requires detailed report).</p>
        <div class="chart-wrap"><canvas id="chart-run" height="300"></canvas></div>
      </div>
    </div>

    <!-- Chart row 3: Complexity comparison (only when multi-complexity) -->
    ${(multiCx && detailData.length) ? `
    <div class="chart-grid wide" style="margin-bottom:20px">
      <div class="chart-card">
        <h2>📊 Complexity Comparison</h2>
        <p class="chart-desc">Side-by-side comparison of model performance across complexity levels. Grouped bars show how scores change with increasing task difficulty.</p>
        <div style="display:flex;gap:10px;margin-bottom:14px;align-items:center;flex-wrap:wrap">
          <label style="font-size:.78rem;color:var(--text-muted)">Metric:</label>
          <select id="cx-metric" onchange="renderComplexityChart()" style="padding:4px 10px;font-size:.78rem">
            <option value="train_score">Train Score</option>
            <option value="inference_score">Inference Score</option>
            <option value="requirements_score">Requirements Score</option>
          </select>

/* ── Complexity comparison chart ─────────────────────────────────────── */
function renderComplexityChart() {
  destroyChart('complexity');
  if (!detailData.length) return;
  const canvasEl = document.getElementById('chart-complexity');
  if (!canvasEl) return;

  const metric = document.getElementById('cx-metric')?.value || 'train_score';
  const cxLevels = allComplexities();

  // Unique model×runner combos across all complexity levels
  const entryKeys = [...new Set(detailData.map(r => `${r.model}|||${r.runner}`))];
  const entries = entryKeys.map(k => { const [model, runner] = k.split('|||'); return { model, runner }; });

  // Compute mean per entry per complexity
  const entryMeans = entries.map(e => {
    const meanAll = avg(detailData.filter(r => r.model === e.model && r.runner === e.runner).map(r => +r[metric] || 0));
    return { ...e, meanAll };
  }).sort((a,b) => b.meanAll - a.meanAll);

  const labels = entryMeans.map(e => entryLabel(e));

  const datasets = cxLevels.map(cx => {
    const data = entryMeans.map(e => {
      const rows = detailData.filter(r => r.model === e.model && r.runner === e.runner && r.complexity === cx);
      return rows.length ? avg(rows.map(r => +r[metric] || 0)) : null;
    });
    return {
      label: `Level ${cx}`,
      data,
      backgroundColor: cxColor(cx) + 'cc',
      borderColor: cxColor(cx),
      borderWidth: 1,
      borderRadius: 4,
    };
  });

  // Dynamic canvas width: more bars need more space
  const neededWidth = Math.max(entryMeans.length * (cxLevels.length * 20 + 30), canvasEl.parentElement.clientWidth);
  canvasEl.style.minWidth = neededWidth + 'px';

  const ctx = canvasEl.getContext('2d');
  charts['complexity'] = new Chart(ctx, {
    type: 'bar',
    data: { labels, datasets },
    options: {
      ...CHART_DEFAULTS,
      responsive: true,
      scales: {
        x: { grid:{ display:false },
             ticks:{ color:'#e6edf3', font:{size:10}, maxRotation:45, minRotation:25 },
             border:{color:'#30363d'} },
        y: { min:0, max:100,
             grid:{ color:'rgba(48,54,61,.5)' },
             ticks:{ color:'#8b949e' },
             border:{color:'#30363d'} },
      },
      plugins: {
        ...CHART_DEFAULTS.plugins,
        legend: { display: true, position: 'top',
                  labels: { color:'#8b949e', boxWidth:12, font:{size:11}, padding:12 } },
        tooltip: {
          ...CHART_DEFAULTS.plugins.tooltip,
          callbacks: {
            label: c => {
              const val = c.parsed.y;
              return val != null ? `Level ${cxLevels[c.datasetIndex]}: ${val.toFixed(1)}` : 'No data';
            },
          },
        },
      },
    },
  });
}

/* ── Model variance chart ───────────────────────────────────────────── */
function renderVarianceChart() {
  destroyChart('variance');
  const fDet = getFilteredDetail();
  if (!fDet.length) return;

  const metric = document.getElementById('var-metric')?.value || 'train_score';
  const models = [...new Set(fDet.map(r => r.model))]
    .map(m => {
      const vals = fDet.filter(r => r.model === m).map(r => +r[metric] || 0);
      const mean  = avg(vals);
      const variance = avg(vals.map(v => (v - mean) ** 2));
      const std   = Math.sqrt(variance);
      return { model: m, mean, std, min: Math.min(...vals), max: Math.max(...vals), vals };
    })
    .sort((a, b) => b.mean - a.mean);

  const labels = models.map(m => shortenModel(m.model));

  // Dataset 1: full range (min → max) — light fill
  const rangeDataset = {
    label: 'Full range (min–max)',
    data: models.map(m => [m.min, m.max]),
    backgroundColor: models.map(m => modelColor(m.model) + '33'),
    borderColor: 'transparent',
    borderWidth: 0,
    borderRadius: 4,
    barPercentage: 0.55,
  };

  // Dataset 2: ±1 std dev band — stronger fill
  const stdDataset = {
    label: '±1 std dev',
    data: models.map(m => [Math.max(0, m.mean - m.std), Math.min(100, m.mean + m.std)]),
    backgroundColor: models.map(m => modelColor(m.model) + '88'),
    borderColor: models.map(m => modelColor(m.model)),
    borderWidth: 1,
    borderRadius: 3,
    barPercentage: 0.55,
  };

  // Dataset 3: mean marker as a 1-unit-tall floating bar
  const meanDataset = {
    label: 'Mean',
    data: models.map(m => [m.mean - 0.6, m.mean + 0.6]),
    backgroundColor: models.map(m => modelColor(m.model)),
    borderColor: models.map(m => modelColor(m.model)),
    borderWidth: 0,
    borderRadius: 1,
    barPercentage: 0.55,
  };

  const ctx = document.getElementById('chart-variance').getContext('2d');
  charts['variance'] = new Chart(ctx, {
    type: 'bar',
    data: { labels, datasets: [rangeDataset, stdDataset, meanDataset] },
    options: {
      ...CHART_DEFAULTS,
      responsive: true,
      indexAxis: 'y',
      scales: {
        x: { min:0, max:100, grid:{ color:'rgba(48,54,61,.5)' }, ticks:{ color:'#8b949e' }, border:{color:'#30363d'} },
        y: { grid:{ display:false }, ticks:{ color:'#e6edf3', font:{size:11} }, border:{color:'#30363d'} },
      },
      plugins: {
        ...CHART_DEFAULTS.plugins,
        legend: { display: false },
        tooltip: {
          ...CHART_DEFAULTS.plugins.tooltip,
          callbacks: {
            label: c => {
              const m = models[c.dataIndex];
              return `mean ${m.mean.toFixed(1)} | std ${m.std.toFixed(1)} | range ${m.min.toFixed(0)}–${m.max.toFixed(0)}`;
            },
          },
        },
      },
    },
  });
}

/* ── Table ──────────────────────────────────────────────────────────── */
const DETAIL_COLS = [
  { key: 'notebook_id',           label: 'Notebook'   },
  { key: 'model',                 label: 'Model'       },
  { key: 'runner',                label: 'Runner'      },
  { key: 'complexity',            label: 'Complexity'  },
  { key: 'run',                   label: 'Run'         },
  { key: 'train_score',           label: 'Train'       },
  { key: 'inference_score',       label: 'Inference'   },
  { key: 'requirements_score',    label: 'Reqs'        },
  { key: 'train_execution_success', label: 'Executed'  },
  { key: 'artifact_match_score',  label: 'Artifacts'   },
  { key: 'outputs_match',         label: 'Out Match'  },
];

function tableHead() {
  return `<thead><tr>${DETAIL_COLS.map(c => `
    <th data-col="${c.key}" class="${detailSort.col===c.key?'sorted':''}" title="Sort by ${c.label}">
      ${c.label}<span class="sort-icon">${detailSort.col===c.key?(detailSort.dir>0?'↑':'↓'):'↕'}</span>
    </th>`).join('')}</tr></thead>`;
}

function getFilteredRows() {
  const nbFilter    = document.getElementById('col-nb')?.value || '';
  const runnerFilter = document.getElementById('col-runner')?.value || '';
  const fDet = getFilteredDetail();

  return [...fDet]
    .filter(r => {
      const haystack = Object.values(r).join(' ').toLowerCase();
      return (!detailFilter || haystack.includes(detailFilter))
          && (!nbFilter     || r.notebook_id === nbFilter)
          && (!runnerFilter || r.runner === runnerFilter);
    })
    .sort((a, b) => {
      const av = a[detailSort.col] ?? '';
      const bv = b[detailSort.col] ?? '';
      return (av < bv ? -1 : av > bv ? 1 : 0) * detailSort.dir;
    });
}

function renderTable() {
  const fDet = getFilteredDetail();
  if (!fDet.length) return;
  const tbody = document.getElementById('table-body');
  if (!tbody) return;
  const rows = getFilteredRows();
  tbody.innerHTML = rows.map(r => `<tr>${DETAIL_COLS.map(c => {
    const v = r[c.key];
    if (c.key === 'model') return `<td title="${v}">${shortenModel(v)}</td>`;
    if (c.key === 'complexity') {
      const cx = v ?? '—';
      return `<td>${cxBadge(v) || cx}</td>`;
    }
    if (c.key === 'train_score' || c.key === 'inference_score' || c.key === 'requirements_score') {
      const n = +v || 0;
      return `<td><span class="score-pill" style="color:${scoreColor(n)};background:${scoreBg(n)}">${n.toFixed(1)}</span></td>`;
    }
    if (typeof v === 'boolean') return `<td class="${v?'bool-true':'bool-false'}">${v?'✓':'✗'}</td>`;
    if (c.key === 'artifact_match_score') return `<td>${(+v||0).toFixed(2)}</td>`;
    return `<td>${v ?? '—'}</td>`;
  }).join('')}</tr>`).join('');

  // re-apply sort indicators
  document.querySelectorAll('th[data-col]').forEach(th => {
    const isSorted = th.dataset.col === detailSort.col;
    th.className = isSorted ? 'sorted' : '';
    th.querySelector('.sort-icon').textContent = isSorted ? (detailSort.dir > 0 ? '↑' : '↓') : '↕';
  });
}

function rerenderTable() { renderTable(); }

/* ── Utils ──────────────────────────────────────────────────────────── */
function shortenModel(name) {
  if (!name) return '';
  return name.length > 28 ? name.slice(0, 26) + '…' : name;
}

function entryLabel(r) {
  const m = shortenModel(r.model || '');
  const rn = r.runner || '';
  const cx = r.complexity != null ? ` C${r.complexity}` : '';
  return rn ? `${m} (${rn})${cx}` : `${m}${cx}`;
}
</script>
